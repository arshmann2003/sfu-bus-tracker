# Public site. Uses the collector image only for its Java runtime.
# The collector service itself is unchanged and stays the only TransLink poller.
services:
  api:
    image: sfu-bus-tracker-collector
    network_mode: host
    entrypoint: ["java", "-Xmx256m", "-jar", "/app/api.jar", "--server.address=127.0.0.1", "--server.port=8081"]
    environment:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/bus
      DB_USER: bus
      DB_PASSWORD: bus
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
    volumes:
      - ./api.jar:/app/api.jar:ro
    restart: unless-stopped

  web:
    image: caddy:2-alpine
    network_mode: host
    volumes:
      - ./dist:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
