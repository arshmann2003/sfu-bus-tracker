services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: bus
      POSTGRES_PASSWORD: bus
      POSTGRES_DB: bus
    # DBeaver on this machine. Not published on the local network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 512mb
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=30
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bus -d bus"]
      interval: 5s
      timeout: 5s
      retries: 20

  collector:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/bus?reWriteBatchedInserts=true
      DB_USER: bus
      DB_PASSWORD: bus
      TRANSLINK_API_KEY: ${TRANSLINK_API_KEY:-}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      ARCHIVE_DIR: /data/archive
    volumes:
      - ./data/archive:/data/archive
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
